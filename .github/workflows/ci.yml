name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Native tests (ASan + UBSan)
        # The shift check is off because the vendored stb_image_write.h
        # left-shifts negative values by design.
        run: |
          g++ -std=c++11 -g -w -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize=shift \
            -fno-sanitize-recover=all -Isrc \
            test/native/image_edit_native_test.cpp src/image_edit.cpp \
            -o "$RUNNER_TEMP/native_test"
          "$RUNNER_TEMP/native_test"
