include: package:flutter_lints/flutter.yaml

analyzer:
  # Required by Flutter's AnalysisOptionsMigration, which otherwise rewrites
  # this file during `flutter pub get` and leaves the tree dirty for
  # `pub publish` (which refuses to publish from a dirty git state). Every
  # platform directory is listed, not just the ones present today, so adding
  # a platform later cannot break the release.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - unnecessary_lambdas
    - unnecessary_this
